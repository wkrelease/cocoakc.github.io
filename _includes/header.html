<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="logo" href="{{ "/" | prepend: site.baseurl }}" aria-label="{{ site.title }}">
      <span class="logo-prompt">&gt;</span>
      <span class="logo-name">{{ site.author }}</span><span class="logo-cursor">_</span>
    </a>

    <nav class="site-nav">
      <a class="nav-link{% if page.url == '/' %} active{% endif %}" href="{{ "/" | prepend: site.baseurl }}">首页</a>
      <a class="nav-link{% if page.url contains '/archive' %} active{% endif %}" href="{{ "/archive/" | prepend: site.baseurl }}">归档</a>
      {% if site.github %}
      <a class="nav-icon" href="https://github.com/{{ site.github }}" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      {% endif %}
      <a class="nav-icon" href="{{ site.rss_url | prepend: site.baseurl }}" aria-label="RSS">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6.18 15.64a2.18 2.18 0 110 4.36 2.18 2.18 0 010-4.36zM4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44zm0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"/></svg>
      </a>
    </nav>
  </div>
</header>
