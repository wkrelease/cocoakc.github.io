---
layout: default
---
<div class="wrap page">
  <header class="page-header">
    <div class="post-path"><a href="{{ "/" | prepend: site.baseurl }}">~</a>{{ page.url }}</div>
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {{ content }}
</div>
